name: CyberShield UK Threat Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-threats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update threat intelligence
        run: python update.py

      - name: Save updated data
        run: |
          if [ -f threats.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add threats.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update cybersecurity threat data'
              git push
            fi
          else
            echo 'ERROR: threats.json was not generated'
            exit 1
          fi
